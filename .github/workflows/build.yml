name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decode app icon
        run: |
          base64 --decode -i icon-1024.b64 -o Assets.xcassets/AppIcon.appiconset/icon-1024.png
          ls -l Assets.xcassets/AppIcon.appiconset/

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project GTA6Helper.xcodeproj \
            -scheme GTA6Helper \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/GTA6Helper.app"
          test -d "$APP_PATH"
          rm -rf Payload GTA6Helper.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry GTA6Helper.ipa Payload
          ls -lh GTA6Helper.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA6Helper-ipa
          path: GTA6Helper.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: GTA6Helper v1.0 (build ${{ github.run_number }})
          files: GTA6Helper.ipa
